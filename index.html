
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grey Matter Study Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- LOGIN CONTAINER -->
    <main class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo">
            <img
                src="images/logo.png"
                alt="Grey Matter Study Hub Logo"
            >
        </div>


        <!-- LOGIN CARD -->
        <section class="auth-card">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Sign in to continue your learning journey.
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->
            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>


        <!-- COPYRIGHT -->
        <p class="copyright">
            © 2026 Grey Matter Study Hub
        </p>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>
</html>
